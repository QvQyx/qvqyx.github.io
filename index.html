<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MINNIE QI | Science &amp; Technology Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Fraunces:opsz,wght,SOFT,WONK@9..144,900,100,1&family=Instrument+Serif:ital@0;1&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: "NeoX Display";
      src: url("assets/fonts/NeoXDisplay1.4-Bold.ttf") format("truetype");
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "NeoX Text";
      src: url("assets/fonts/NeoXText1.4-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "NeoX Text";
      src: url("assets/fonts/NeoXText1.4-Bold.ttf") format("truetype");
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "NeoX Mono";
      src: url("assets/fonts/NeoXMono1.4-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --bg: #070706;
      --ink: #f3efe6;
      --soft: rgba(236, 229, 214, .72);
      --muted: rgba(198, 188, 171, .62);
      --cyan: #8bd8d2;
      --aqua: #c7e8d5;
      --violet: #8a7a90;
      --rose: #d38b7c;
      --amber: #d8a85d;
      --green: #8d9b79;
      --panel: rgba(32, 30, 27, .72);
      --line: rgba(139, 216, 210, .18);
      --shadow: rgba(0, 0, 0, .45);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: auto;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "NeoX Text", "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 76% 10%, rgba(216, 168, 93, .16), transparent 23rem),
        radial-gradient(circle at 12% 32%, rgba(139, 216, 210, .11), transparent 28rem),
        linear-gradient(180deg, #10100e 0%, #080807 52%, #040403 100%);
      cursor: none;
      overscroll-behavior: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -4;
      opacity: .2;
      background-image:
        linear-gradient(rgba(243, 239, 230, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(243, 239, 230, .035) 1px, transparent 1px);
      background-size: 84px 84px;
      mask-image: radial-gradient(circle at 50% 34%, black, transparent 76%);
      pointer-events: none;
    }

    .aurora {
      position: fixed;
      inset: -20vh -10vw;
      z-index: -3;
      pointer-events: none;
      filter: blur(70px);
      opacity: .38;
      background:
        radial-gradient(circle at var(--mx, 50%) var(--my, 35%), rgba(139, 216, 210, .18), transparent 22rem),
        radial-gradient(circle at calc(var(--mx, 50%) + 18%) calc(var(--my, 35%) + 20%), rgba(216, 168, 93, .12), transparent 24rem),
        radial-gradient(circle at 15% 80%, rgba(126, 93, 69, .14), transparent 20rem);
      transition: background .16s linear;
    }

    .ripple-field {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }

    .ripple {
      position: absolute;
      width: 22rem;
      height: 22rem;
      border: 1px solid rgba(216, 168, 93, .16);
      border-radius: 999px;
      transform: translate(-50%, -50%) scale(.2);
      opacity: 0;
      animation: ripple 1.8s ease-out forwards;
    }

    @keyframes ripple {
      0% { opacity: .48; transform: translate(-50%, -50%) scale(.05); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
    }

    .cursor {
      position: fixed;
      left: 0;
      top: 0;
      width: 18px;
      height: 18px;
      z-index: 999;
      border-radius: 50%;
      border: 1px solid rgba(244, 251, 255, .9);
      transform: translate(-50%, -50%);
      pointer-events: none;
      mix-blend-mode: screen;
      box-shadow: 0 0 24px rgba(216, 168, 93, .36);
    }

    .cursor-trail {
      position: fixed;
      width: 8px;
      height: 8px;
      z-index: 998;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      background: rgba(216, 168, 93, .42);
      filter: blur(1px);
      opacity: .55;
    }

    nav {
      position: fixed;
      left: 50%;
      top: 22px;
      z-index: 50;
      width: min(1180px, calc(100vw - 40px));
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border: 1px solid rgba(243, 239, 230, .1);
      border-radius: 999px;
      background: rgba(12, 12, 10, .58);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .28);
      backdrop-filter: blur(22px);
      transform: translateX(-50%);
    }

    .brand {
      font-family: "NeoX Display", "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      letter-spacing: 0;
      font-size: 1.15rem;
      color: transparent;
      background: linear-gradient(135deg, #f3efe6, #d8a85d 48%, #8bd8d2);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow:
        0 1px 0 rgba(255,255,255,.16),
        0 8px 24px rgba(216, 168, 93, .18);
    }

    nav a {
      color: var(--soft);
      text-decoration: none;
      font-weight: 700;
      font-size: .82rem;
      margin-left: 24px;
      transition: color .2s ease;
    }

    nav a:hover { color: var(--ink); }

    .scroll-progress {
      position: fixed;
      left: 50%;
      top: 104px;
      z-index: 51;
      width: min(720px, calc(100vw - 80px));
      height: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(243, 239, 230, .08);
      transform: translateX(-50%);
    }

    .scroll-progress span {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--amber), var(--ink), var(--cyan));
      transform: scaleX(0);
      transform-origin: 0 50%;
      will-change: transform;
    }

    #smoothContent {
      position: relative;
      z-index: 1;
    }

    body.smooth-ready #smoothContent {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      min-height: 100vh;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    main {
      position: relative;
      z-index: 1;
    }

    section {
      min-height: 100vh;
      padding: 110px max(6vw, 24px);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 1.02fr);
      align-items: center;
      gap: 6vw;
      padding-top: 150px;
      position: relative;
      isolation: isolate;
    }

    .hero > div:first-child {
      position: relative;
    }

    .hero > div:first-child::before {
      content: "REALITY";
      position: absolute;
      left: -8px;
      top: 18px;
      z-index: -1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(243, 239, 230, .06);
      font-family: "NeoX Display", "Bricolage Grotesque", sans-serif;
      font-size: clamp(7rem, 15vw, 16rem);
      font-weight: 800;
      line-height: .75;
      transform: rotate(-3deg);
      pointer-events: none;
    }

    .hero::before {
      content: "";
      position: absolute;
      left: 5vw;
      right: 5vw;
      bottom: 5vh;
      height: 34vh;
      z-index: -1;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 42% 50%, rgba(216, 168, 93, .16), transparent 62%),
        radial-gradient(ellipse at 58% 50%, rgba(139, 216, 210, .1), transparent 58%);
      filter: blur(18px);
      transform: rotate(-3deg);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 18px;
      border: 1px solid rgba(36, 255, 188, .3);
      border-radius: 999px;
      color: rgba(243, 239, 230, .78);
      background: rgba(243, 239, 230, .055);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1, h2, h3 {
      margin: 0;
      font-family: "NeoX Display", "Bricolage Grotesque", sans-serif;
      letter-spacing: 0;
    }

    h1 {
      margin-top: 34px;
      max-width: 760px;
      font-size: clamp(3.15rem, 7.2vw, 7.15rem);
      line-height: .88;
      font-weight: 800;
      color: rgba(243, 239, 230, .82);
      -webkit-text-stroke: 1px rgba(255,255,255,.18);
      text-shadow:
        0 1px 0 rgba(255,255,255,.2),
        0 10px 28px rgba(216,168,93,.13),
        0 34px 90px rgba(0,0,0,.45);
    }

    .liquid-word {
      display: block;
      font-family: "NeoX Display", "Fraunces", serif;
      color: transparent;
      background:
        radial-gradient(circle at 30% 18%, rgba(255,255,255,.96) 0 5%, transparent 6%),
        linear-gradient(145deg, rgba(255,245,221,.9) 0%, rgba(216,168,93,.74) 38%, rgba(139,216,210,.48) 76%, rgba(243,239,230,.28) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-stroke: 1px rgba(255, 245, 220, .26);
      text-shadow:
        0 1px 0 rgba(255,255,255,.38),
        0 5px 0 rgba(111, 75, 45, .34),
        0 15px 32px rgba(216, 168, 93, .24),
        0 24px 70px rgba(0, 0, 0, .45);
      animation: jelly 5.2s ease-in-out infinite;
      transform-origin: 50% 60%;
      filter: drop-shadow(0 0 18px rgba(216, 168, 93, .16));
    }

    @keyframes jelly {
      0%, 100% { transform: scaleX(1) scaleY(1) rotate(-1deg); filter: hue-rotate(0deg); }
      35% { transform: scaleX(1.035) scaleY(.96) rotate(.6deg); }
      62% { transform: scaleX(.97) scaleY(1.04) rotate(-.4deg); filter: hue-rotate(12deg); }
    }

    .hero p {
      max-width: 620px;
      color: rgba(236, 229, 214, .78);
      font-family: "NeoX Text", "Instrument Serif", serif;
      font-size: clamp(1.05rem, 1.45vw, 1.4rem);
      line-height: 1.55;
    }

    .device {
      position: relative;
      min-height: 540px;
      border: 1px solid rgba(243, 239, 230, .12);
      border-radius: 36px;
      padding: 28px;
      background: linear-gradient(145deg, rgba(42, 35, 27, .76), rgba(13, 12, 10, .58));
      box-shadow: 0 32px 120px rgba(0, 0, 0, .4);
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .device::before {
      content: "";
      position: absolute;
      inset: -35%;
      background: conic-gradient(from 120deg, transparent, rgba(216, 168, 93, .18), transparent, rgba(139, 216, 210, .12), transparent);
      animation: spin 12s linear infinite;
      opacity: .42;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .device-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      min-height: 484px;
      border-radius: 26px;
      background: rgba(3, 7, 18, .78);
      overflow: hidden;
    }

    .browser-top {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cyan);
    }

    .dot:nth-child(2) { background: var(--amber); }
    .dot:nth-child(3) { background: var(--rose); }

    .signal-lab {
      height: 430px;
      position: relative;
      padding: 36px;
    }

    .wave {
      position: absolute;
      left: 34px;
      right: 34px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--aqua), transparent);
      animation: drift 4.6s ease-in-out infinite;
    }

    .wave:nth-child(1) { top: 110px; }
    .wave:nth-child(2) { top: 185px; animation-delay: -.8s; opacity: .65; }
    .wave:nth-child(3) { top: 260px; animation-delay: -1.6s; opacity: .45; background: linear-gradient(90deg, transparent, var(--rose), transparent); }

    @keyframes drift {
      0%, 100% { transform: translateX(-14px) scaleX(.86); }
      50% { transform: translateX(24px) scaleX(1.05); }
    }

    .mini-wall {
      position: absolute;
      left: 34px;
      bottom: 30px;
      right: 34px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .mini-card {
      height: 86px;
      border-radius: 18px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(243, 239, 230, .1);
    }

    .scroll-note {
      position: absolute;
      right: 32px;
      bottom: 32px;
      color: var(--cyan);
      font-weight: 800;
      font-size: .78rem;
    }

    .hero-index {
      position: relative;
      min-height: 620px;
      border-radius: 42px;
      padding: clamp(20px, 3vw, 34px);
      background:
        radial-gradient(circle at 22% 18%, rgba(216, 168, 93, .16), transparent 25rem),
        radial-gradient(circle at 82% 78%, rgba(139, 216, 210, .11), transparent 20rem),
        linear-gradient(145deg, rgba(243, 239, 230, .055), rgba(243, 239, 230, .015));
      overflow: visible;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .hero-index::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 54%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(216, 168, 93, .42), rgba(139, 216, 210, .32), transparent);
      box-shadow: 0 0 44px rgba(216, 168, 93, .14);
      transform: rotate(-12deg);
    }

    .hero-index::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -80px;
      bottom: -70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(126, 93, 69, .24), transparent 68%);
      filter: blur(8px);
    }

    .desk-lamp {
      position: absolute;
      right: 8%;
      top: 0;
      width: 34%;
      height: 42%;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 15%, rgba(244, 221, 175, .28), rgba(216, 168, 93, .08) 44%, transparent 72%);
      filter: blur(7px);
      pointer-events: none;
      transform: rotate(8deg);
    }

    .desk-surface {
      position: absolute;
      left: -6%;
      right: -4%;
      bottom: 4%;
      height: 42%;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 42% 46%, rgba(216, 168, 93, .13), transparent 62%),
        radial-gradient(ellipse at 58% 54%, rgba(139, 216, 210, .08), transparent 58%),
        rgba(243, 239, 230, .025);
      filter: blur(2px);
      transform: perspective(700px) rotateX(60deg) rotateZ(-4deg);
      pointer-events: none;
    }

    .artifact-orbit {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .artifact {
      position: absolute;
      display: block;
      overflow: hidden;
      border: 1px solid rgba(243, 239, 230, .12);
      border-radius: 18px;
      background: rgba(243, 239, 230, .06);
      box-shadow: 0 30px 70px rgba(0, 0, 0, .38);
      text-decoration: none;
      transform: translate3d(0, var(--float, 0px), var(--z, 0px)) rotate(var(--r, 0deg));
      transition: transform .45s cubic-bezier(.16,1,.3,1), opacity .3s ease, border-color .3s ease;
      cursor: none;
      touch-action: manipulation;
      user-select: none;
    }

    .artifact.is-dragging {
      z-index: 10;
      border-color: rgba(216, 168, 93, .48);
      box-shadow: 0 46px 130px rgba(0, 0, 0, .48);
      transition: none;
    }

    .artifact:hover {
      transform: translate3d(0, calc(var(--float, 0px) - 10px), var(--z, 0px)) rotate(var(--r, 0deg)) scale(1.025);
      border-color: rgba(216, 168, 93, .34);
      z-index: 5;
    }

    .artifact img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: .78;
      filter: saturate(.76) contrast(1.04) sepia(.06);
    }

    .artifact::after {
      content: attr(data-label);
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 12px;
      color: var(--ink);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .02em;
      text-shadow: 0 2px 16px rgba(0,0,0,.7);
    }

    .artifact.pipa {
      left: 2%;
      top: 8%;
      width: 57%;
      height: 30%;
      --r: -6deg;
      --z: 26px;
    }

    .artifact.forest {
      right: -1%;
      top: 33%;
      width: 49%;
      height: 29%;
      --r: 6deg;
      --z: 18px;
    }

    .artifact.game {
      left: 9%;
      bottom: 8%;
      width: 46%;
      height: 27%;
      --r: 4deg;
      --z: 32px;
    }

    .artifact.caption {
      right: 8%;
      bottom: 9%;
      width: 39%;
      height: 22%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: rgba(14, 13, 11, .76);
      backdrop-filter: blur(16px);
      --r: -3deg;
    }

    .artifact.caption::after { display: none; }

    .artifact.caption strong {
      color: var(--amber);
      font-size: .78rem;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .artifact.caption p {
      margin: 16px 0 0;
      color: rgba(236, 229, 214, .72);
      font-family: "NeoX Text", "Instrument Serif", serif;
      font-size: clamp(1.05rem, 1.35vw, 1.42rem);
      line-height: 1.2;
    }

    .desk-note,
    .desk-ticket,
    .audio-strip {
      color: var(--ink);
      padding: 18px;
    }

    .desk-note {
      left: 48%;
      top: 6%;
      width: 33%;
      height: 24%;
      background:
        linear-gradient(180deg, rgba(244, 230, 202, .96), rgba(202, 184, 151, .92));
      color: #1b1812;
      --r: 8deg;
      --z: 42px;
    }

    .desk-note::after,
    .desk-ticket::after,
    .audio-strip::after { display: none; }

    .desk-note strong,
    .desk-ticket strong,
    .audio-strip strong {
      display: block;
      font-family: "NeoX Display", "Bricolage Grotesque", sans-serif;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .72;
    }

    .desk-note p {
      margin: 20px 0 0;
      font-family: "NeoX Text", "Instrument Serif", serif;
      font-size: clamp(1.15rem, 1.55vw, 1.7rem);
      line-height: 1.05;
      color: #201810;
    }

    .desk-ticket {
      left: 42%;
      top: 42%;
      width: 27%;
      height: 20%;
      background: rgba(16, 15, 13, .82);
      border-color: rgba(216, 168, 93, .24);
      --r: -8deg;
      --z: 48px;
    }

    .desk-ticket p {
      margin: 14px 0 0;
      color: rgba(236, 229, 214, .72);
      font-size: .82rem;
      line-height: 1.4;
    }

    .audio-strip {
      left: 23%;
      top: 38%;
      width: 34%;
      height: 14%;
      border-radius: 999px;
      background: rgba(9, 9, 8, .78);
      border-color: rgba(139, 216, 210, .22);
      display: flex;
      align-items: center;
      gap: 6px;
      --r: 2deg;
      --z: 52px;
    }

    .audio-bar {
      width: 5px;
      height: var(--h, 28px);
      border-radius: 999px;
      background: linear-gradient(180deg, var(--aqua), var(--amber));
      opacity: .72;
      animation: pulseBar 1.8s ease-in-out infinite;
      animation-delay: calc(var(--i) * -.12s);
    }

    @keyframes pulseBar {
      0%, 100% { transform: scaleY(.62); opacity: .46; }
      50% { transform: scaleY(1.1); opacity: .95; }
    }

    .desk-chip {
      position: absolute;
      z-index: 4;
      right: 26%;
      top: 28%;
      padding: 10px 14px;
      border: 1px solid rgba(139, 216, 210, .25);
      border-radius: 999px;
      color: var(--aqua);
      background: rgba(10, 10, 9, .76);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      transform: translateY(var(--float, 0px)) rotate(-5deg);
      box-shadow: 0 18px 42px rgba(0,0,0,.3);
    }

    .index-kicker {
      color: var(--aqua);
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: .74rem;
      margin-bottom: 68px;
    }

    .index-row {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 18px;
      padding: 18px 0;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      transition: transform .25s ease, color .25s ease, border-color .25s ease;
    }

    .index-row:hover {
      transform: translateX(10px);
      color: var(--cyan);
      border-color: rgba(216, 168, 93, .34);
    }

    .index-row span {
      color: rgba(198, 188, 171, .48);
      font-family: "NeoX Display", "Fraunces", serif;
      font-size: .95rem;
    }

    .index-row strong {
      display: block;
      font-size: clamp(1.2rem, 1.7vw, 1.65rem);

    function updateCursor() {
      cursor.style.transform = `translate(${mouse.x}px, ${mouse.y}px) translate(-50%, -50%)`;
      trailPoints = trailPoints.map((point, index) => {
        const target = index === 0 ? mouse : trailPoints[index - 1];
        return {
          x: point.x + (target.x - point.x) * .34,
          y: point.y + (target.y - point.y) * .34
        };
      });
      trails.forEach((trail, index) => {
        const point = trailPoints[index];
        trail.style.transform = `translate(${point.x}px, ${point.y}px) translate(-50%, -50%)`;
        trail.style.opacity = String(.42 - index * .055);
      });
    }

    function createRipple(x, y) {
      const ripple = document.createElement("span");

      rippleField.appendChild(ripple);
      setTimeout(() => ripple.remove(), 1900);
    }

    function attachTilt() {
      document.querySelectorAll("[data-tilt]").forEach(card => {
        card.addEventListener("mousemove", event => {
          const rect = card.getBoundingClientRect();
          const x = (event.clientX - rect.left) / rect.width - .5;
          const y = (event.clientY - rect.top) / rect.height - .5;
          const cardRotation = getComputedStyle(card).getPropertyValue("--card-r").trim() || "0deg";
          card.style.setProperty("--px", `${(event.clientX - rect.left) / rect.width * 100}%`);
          card.style.setProperty("--py", `${(event.clientY - rect.top) / rect.height * 100}%`);
          if (card.classList.contains("project-card")) return;
          card.style.transform = `perspective(900px) rotateX(${y * -6}deg) rotateY(${x * 8}deg) translateY(-6px) rotate(${cardRotation})`;
        });
        card.addEventListener("mouseleave", () => {
          card.style.transform = "";
        });
      });
    }

    function attachDeskDrag() {
      document.querySelectorAll(".artifact").forEach(item => {
        let state = null;
        item.addEventListener("pointerdown", event => {
          if (event.button !== 0) return;
          const rect = item.getBoundingClientRect();
          state = {
            startX: event.clientX,
            startY: event.clientY,
            originX: Number(item.dataset.dragX || 0),
            originY: Number(item.dataset.dragY || 0),
            moved: false
          };
          item.classList.add("is-dragging");
          item.setPointerCapture(event.pointerId);
        });
        item.addEventListener("pointermove", event => {
          if (!state) return;
          const dx = event.clientX - state.startX;
          const dy = event.clientY - state.startY;
          if (Math.abs(dx) + Math.abs(dy) > 8) state.moved = true;
          item.dataset.dragX = String(state.originX + dx);
          item.dataset.dragY = String(state.originY + dy);
          item.style.marginLeft = `${state.originX + dx}px`;
          item.style.marginTop = `${state.originY + dy}px`;
        });
        item.addEventListener("pointerup", event => {
          if (!state) return;
          if (state.moved) {
            event.preventDefault();
            item.dataset.preventClick = "true";
          }
          item.classList.remove("is-dragging");
          state = null;
        });
        item.addEventListener("pointercancel", () => {
          item.classList.remove("is-dragging");
          state = null;
        });
        item.addEventListener("click", event => {
          if (item.dataset.preventClick === "true") {
            event.preventDefault();
            event.stopImmediatePropagation();
            item.dataset.preventClick = "";
          }
        });
        item.addEventListener("dblclick", event => {
          event.preventDefault();
          item.dataset.dragX = "0";
          item.dataset.dragY = "0";
          item.style.marginLeft = "";
          item.style.marginTop = "";
        });
      });
    }

    function attachPipelineFocus() {
      const readout = panel.querySelector(".readout-text");
      if (!readout) return;
      panel.querySelectorAll(".pipeline-node").forEach(node => {
        node.addEventListener("click", () => {
          panel.querySelectorAll(".pipeline-node").forEach(item => item.classList.remove("active"));
          node.classList.add("active");
          readout.textContent = `${node.dataset.pipelineTitle}: ${node.dataset.pipelineBody}`;
        });
      });
    }

    function revealOnScroll() {
      document.querySelectorAll(".reveal").forEach(item => {
        if (item.classList.contains("visible")) return;
        const rect = item.getBoundingClientRect();
        if (rect.top < window.innerHeight * .86 && rect.bottom > window.innerHeight * .05) {
          item.classList.add("visible");
        }
      });
    }

    function smoothScrollFrame() {
      if (!reduceMotion) {
        smooth.target = window.scrollY || window.pageYOffset;
        smooth.current += (smooth.target - smooth.current) * smooth.ease;
        if (Math.abs(smooth.target - smooth.current) < .08) smooth.current = smooth.target;
        smoothContent.style.transform = `translate3d(0, ${-smooth.current}px, 0)`;
        const max = Math.max(1, document.body.scrollHeight - window.innerHeight);
        progressBar.style.transform = `scaleX(${Math.min(1, smooth.current / max)})`;
        document.documentElement.style.setProperty("--scroll", smooth.current.toFixed(2));
        document.querySelector(".aurora").style.transform = `translate3d(0, ${smooth.current * -0.018}px, 0)`;
        document.querySelectorAll("[data-float]").forEach(item => {
          const depth = Number(item.dataset.float || 0);
          item.style.setProperty("--float", `${smooth.current * -depth}px`);
        });
      }
      updateCursor();
      revealOnScroll();
      requestAnimationFrame(smoothScrollFrame);
    }

    function wireAnchors() {
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", event => {
          if (anchor.dataset.openProject) return;
          const target = document.querySelector(anchor.getAttribute("href"));
          if (!target || reduceMotion) return;
          event.preventDefault();
          window.scrollTo({ top: target.offsetTop - 40, behavior: "smooth" });
        });
      });
    }

    function wireProjectLinks() {
      document.querySelectorAll("[data-open-project]").forEach(trigger => {
        trigger.addEventListener("click", event => {
          event.preventDefault();
          const work = document.getElementById("work");
          const open = () => openProject(trigger.dataset.openProject);
          if (reduceMotion) {
            work.scrollIntoView();
            open();
            return;
          }
          window.scrollTo({ top: work.offsetTop - 40, behavior: "smooth" });
          window.setTimeout(open, 420);
        });
      });
    }

    renderCards();
    wireAnchors();
    wireProjectLinks();
    setBodyHeight();
    if (!reduceMotion) document.body.classList.add("smooth-ready");
    document.querySelectorAll(".reveal").forEach(item => item.classList.add("visible"));
    const galleryPrev = document.getElementById("galleryPrev");
    const galleryNext = document.getElementById("galleryNext");
    const galleryCards = [...grid.querySelectorAll(".project-card")];
    const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
    let galleryIndex = 0;
    let galleryFrame = 0;
    grid.tabIndex = 0;
    function updateGallery() {
      galleryFrame = 0;
      const center = grid.getBoundingClientRect().left + grid.clientWidth / 2;
      let nearest = Infinity;
      galleryCards.forEach((card, index) => {
        const rect = card.getBoundingClientRect();
        const distance = Math.abs(rect.left + rect.width / 2 - center);
        if (distance < nearest) { nearest = distance; galleryIndex = index; }
      });
      galleryCards.forEach((card, index) => card.classList.toggle("is-current", index === galleryIndex));
      galleryPrev.disabled = galleryIndex === 0;
      galleryNext.disabled = galleryIndex === galleryCards.length - 1;
    }
    function moveGallery(direction) {
      galleryIndex = Math.max(0, Math.min(galleryCards.length - 1, galleryIndex + direction));
      const rect = galleryCards[galleryIndex].getBoundingClientRect();
      const viewport = grid.getBoundingClientRect();
      grid.scrollBy({ left: rect.left + rect.width / 2 - viewport.left - grid.clientWidth / 2,
        behavior: motionPreference.matches ? "instant" : "smooth" });
    }
    galleryPrev.addEventListener("click", () => moveGallery(-1));
    galleryNext.addEventListener("click", () => moveGallery(1));
    grid.addEventListener("scroll", () => {
      if (!galleryFrame) galleryFrame = requestAnimationFrame(updateGallery);
    }, { passive: true });
    grid.addEventListener("keydown", event => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      event.stopPropagation();
      moveGallery(event.key === "ArrowRight" ? 1 : -1);
    });
    window.addEventListener("resize", updateGallery);
    updateGallery();
    const hashProject = projects.find(project => `#${project.id}` === location.hash);
    if (hashProject) {
      window.setTimeout(() => openProject(hashProject.id), 120);
    }
    window.addEventListener("resize", setBodyHeight);

    window.addEventListener("pointermove", event => {
      mouse = { x: event.clientX, y: event.clientY };
      document.documentElement.style.setProperty("--mx", `${event.clientX / window.innerWidth * 100}%`);
      document.documentElement.style.setProperty("--my", `${event.clientY / window.innerHeight * 100}%`);
    });


    grid.addEventListener("click", event => {
      const card = event.target.closest("[data-project]");
      if (card) openProject(card.dataset.project);
    });

    close.addEventListener("click", closeProject);
    prevProjectButton.addEventListener("click", () => switchProject(-1));
    nextProjectButton.addEventListener("click", () => switchProject(1));
    window.addEventListener("keydown", event => {
      if (event.key === "Escape") closeProject();
      if (!panel.classList.contains("open")) return;
      if (event.key === "ArrowLeft") switchProject(-1);
      if (event.key === "ArrowRight") switchProject(1);
    });
  </script>
</body>
</html>
