<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocabulary Recall Trainer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f6f7f9, #111318);
      --panel: light-dark(#ffffff, #191d24);
      --panel-2: light-dark(#eef2f7, #232936);
      --text: light-dark(#17202e, #edf1f7);
      --muted: light-dark(#5c6675, #a9b2c1);
      --border: light-dark(#d8dee8, #343c4c);
      --accent: light-dark(#0f766e, #2dd4bf);
      --accent-strong: light-dark(#115e59, #5eead4);
      --danger: light-dark(#b42318, #ff8a80);
      --ok: light-dark(#15803d, #86efac);
      font-family: Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .app {
      width: min(1120px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 28px;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(76px, 1fr));
      gap: 8px;
      min-width: min(420px, 100%);
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
    }
    .stat b {
      display: block;
      font-size: 18px;
      line-height: 1.1;
    }
    .stat span {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
    }
    .layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 14px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    .controls {
      display: grid;
      gap: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }
    select, input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 7px;
      padding: 9px 10px;
      font: inherit;
    }
    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    button {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 7px;
      padding: 10px 12px;
      font: inherit;
      cursor: pointer;
      min-height: 40px;
    }
    button:hover { border-color: var(--accent); }
    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 700;
    }
    .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 700;
    }
    .danger { color: var(--danger); }
    .good { color: var(--ok); }
    .quiz {
      min-height: 440px;
      display: grid;
      gap: 12px;
    }
    .card-main {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 22px;
      min-height: 310px;
      display: grid;
      align-content: center;
      gap: 18px;
    }
    .group {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .prompt {
      font-size: clamp(30px, 6vw, 62px);
      line-height: 1.05;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .prompt.definition {
      font-size: clamp(22px, 3.2vw, 34px);
      line-height: 1.25;
      font-weight: 760;
    }
    .answer {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      color: var(--text);
      font-size: 22px;
      line-height: 1.35;
      min-height: 56px;
      overflow-wrap: anywhere;
    }
    .answer.hidden {
      color: var(--muted);
      font-size: 16px;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .history {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mini h2 {
      margin: 0 0 10px;
      font-size: 15px;
    }
    .list {
      display: grid;
      gap: 6px;
      max-height: 210px;
      overflow: auto;
      padding-right: 4px;
    }
    .item {
      border-top: 1px solid var(--border);
      padding-top: 6px;
      font-size: 13px;
      line-height: 1.35;
    }
    .item b { display: block; }
    .empty {
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 760px) {
      header { display: grid; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .layout { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr 1fr; }
      .history { grid-template-columns: 1fr; }
      .card-main { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Vocabulary Recall Trainer</h1>
        <div class="sub"><span id="deckCount"></span> words from the cleaned study list</div>
      </div>
      <section class="stats" aria-label="Session stats">
        <div class="stat"><b id="seenCount">0</b><span>Reviewed</span></div>
        <div class="stat"><b id="knownCount">0</b><span>Known</span></div>
        <div class="stat" aria-live="polite"><b id="missedCount">0</b><span>Missed Remaining</span></div>
        <div class="stat"><b id="accuracy">0%</b><span>Accuracy</span></div>
      </section>
    </header>
    <section class="layout">
      <aside class="panel controls">
        <div>
          <label for="groupSelect">Study Group</label>
          <select id="groupSelect"></select>
        </div>
        <div>
          <label>Quiz Direction</label>
          <div class="segmented">
            <button type="button" id="modeWord" class="active">Word → Meaning</button>
            <button type="button" id="modeDef">Meaning → Word</button>
          </div>
        </div>
        <div>
          <label>Draw Mode</label>
          <div class="segmented">
            <button type="button" id="drawWeak" class="active">Prioritize Missed</button>
            <button type="button" id="drawRandom">Random</button>
          </div>
        </div>
        <div>
          <label for="searchBox">Filter</label>
          <input id="searchBox" type="search" placeholder="word or definition">
        </div>
        <button type="button" id="resetSession">Reset Session</button>
        <button type="button" id="resetMemory" class="danger">Clear Saved Progress</button>
      </aside>
      <section class="quiz">
        <article class="card-main" aria-live="polite">
          <div class="group" id="currentGroup"></div>
          <div class="prompt" id="promptText"></div>
          <div class="answer hidden" id="answerText">Answer first, then reveal</div>
        </article>
        <div class="actions">
          <button type="button" id="showAnswer" class="primary">Reveal Answer</button>
          <button type="button" id="knowBtn">I Know It</button>
          <button type="button" id="missBtn">Missed It</button>
          <button type="button" id="nextBtn">Next Word</button>
          <button type="button" id="restartBtn" class="primary" hidden>Start Again</button>
        </div>
        <section class="history">
          <div class="panel mini">
            <h2>Missed Remaining</h2>
            <div class="list" id="missedList"></div>
          </div>
          <div class="panel mini">
            <h2>Recently Reviewed</h2>
            <div class="list" id="recentList"></div>
          </div>
        </section>
      </section>
    </section>
  </main>

    const GROUPS = ["Agreement, Law, And Rules","Appearance, Sound, And Senses","Character And Behavior","Criticism, Mockery, And Conflict","Deceit, Secrecy, And Artificiality","Desire, Appeal, And Motivation","Emotion And Temperament","General Study Words","Groups, Society, And People","Growth, Decline, And Change","Hardship, Harm, And Poverty","Movement, Travel, And Direction","Objects, Clothing, And Materials","Order, Mixture, And Structure","Place, Nature, And Physical World","Power, Action, And Control","Praise, Respect, And Fame","Quantity, Degree, And Time","Religion, Ritual, And Heritage","Speech, Writing, And Meaning","Thinking, Knowledge, And Proof","Work, Skill, And Practical Life"];
    const storageKey = "codex_vocab_quiz_memory_v1";
    const session = { seen: 0, known: 0, missed: 0, recent: [], missedItems: [] };
    let memory = loadMemory();
    let current = null;
    let answerVisible = false;
    let mode = "word";
    let draw = "weak";

    const els = {
      deckCount: document.getElementById("deckCount"),
      groupSelect: document.getElementById("groupSelect"),
      searchBox: document.getElementById("searchBox"),
      modeWord: document.getElementById("modeWord"),
      modeDef: document.getElementById("modeDef"),
      drawWeak: document.getElementById("drawWeak"),
      drawRandom: document.getElementById("drawRandom"),
      currentGroup: document.getElementById("currentGroup"),
      promptText: document.getElementById("promptText"),
      answerText: document.getElementById("answerText"),
      showAnswer: document.getElementById("showAnswer"),
      knowBtn: document.getElementById("knowBtn"),
      missBtn: document.getElementById("missBtn"),
      nextBtn: document.getElementById("nextBtn"),
      restartBtn: document.getElementById("restartBtn"),
      resetSession: document.getElementById("resetSession"),
      resetMemory: document.getElementById("resetMemory"),
      seenCount: document.getElementById("seenCount"),
      knownCount: document.getElementById("knownCount"),
      missedCount: document.getElementById("missedCount"),
      accuracy: document.getElementById("accuracy"),
      missedList: document.getElementById("missedList"),
      recentList: document.getElementById("recentList")
    };

    init();

    function init() {
      els.deckCount.textContent = WORDS.length;
      els.groupSelect.innerHTML = '<option value="">All Groups</option>' + GROUPS.map(group => '<option>' + escapeHtml(group) + '</option>').join("");
      bind();
      pickNext();
      updateStats();
    }

    function bind() {
      els.groupSelect.addEventListener("change", pickNext);
      els.searchBox.addEventListener("input", pickNext);
      els.showAnswer.addEventListener("click", reveal);
      els.nextBtn.addEventListener("click", pickNext);
      els.restartBtn.addEventListener("click", () => {
        memory = {};
        localStorage.removeItem(storageKey);
        session.seen = 0; session.known = 0; session.missed = 0; session.recent = []; session.missedItems = [];
        els.groupSelect.value = "";
        els.searchBox.value = "";
        setDraw("weak");
      });
      els.knowBtn.addEventListener("click", () => grade(true));
      els.missBtn.addEventListener("click", () => grade(false));
      els.modeWord.addEventListener("click", () => setMode("word"));
      els.modeDef.addEventListener("click", () => setMode("definition"));
      els.drawWeak.addEventListener("click", () => setDraw("weak"));
      els.drawRandom.addEventListener("click", () => setDraw("random"));
      els.resetSession.addEventListener("click", () => {
        session.seen = 0; session.known = 0; session.missed = 0; session.recent = []; session.missedItems = [];
        updateStats();
        renderLists();
      });
      els.resetMemory.addEventListener("click", () => {
        memory = {};
        localStorage.removeItem(storageKey);
        pickNext();
      });
      window.addEventListener("keydown", event => {
        if (event.target.matches("input, select")) return;
        if (event.key === " ") { event.preventDefault(); answerVisible ? pickNext() : reveal(); }
        if (event.key === "1") grade(true);
        if (event.key === "2") grade(false);
      });
    }

    function setMode(nextMode) {
      mode = nextMode;
      els.modeWord.classList.toggle("active", mode === "word");
      els.modeDef.classList.toggle("active", mode === "definition");
      renderCard();
    }

    function setDraw(nextDraw) {
      draw = nextDraw;
      els.drawWeak.classList.toggle("active", draw === "weak");
      els.drawRandom.classList.toggle("active", draw === "random");
      pickNext();
    }

    function filteredWords() {
      const group = els.groupSelect.value;
      const query = els.searchBox.value.trim().toLowerCase();
      return WORDS.filter(item => {
        const groupMatch = !group || item.group === group;
        const queryMatch = !query || item.word.toLowerCase().includes(query) || item.definition.toLowerCase().includes(query);
        return groupMatch && queryMatch;
      });
    }

    function pickNext() {
      const deck = filteredWords();
      answerVisible = false;
      const pending = deck.filter(item => memory[item.word]?.status === "missed");
      const uncleared = deck.filter(item => memory[item.word]?.status !== "known");
      const pool = draw === "weak" ? (pending.length ? pending : uncleared) : deck;
      els.restartBtn.hidden = !(deck.length && !pool.length);
      if (!pool.length) {
        current = null;
        els.currentGroup.textContent = "";
        els.promptText.textContent = deck.length ? "All words cleared!" : "No matching words";
        els.promptText.classList.remove("definition");
        els.answerText.textContent = deck.length ? "All words in this selection are known." : "Try a different filter";
        els.answerText.classList.remove("hidden");
        els.showAnswer.disabled = els.knowBtn.disabled = els.missBtn.disabled = els.nextBtn.disabled = true;
        updateStats();
        renderLists();
        return;
      }
      els.showAnswer.disabled = els.knowBtn.disabled = els.missBtn.disabled = els.nextBtn.disabled = false;
      const alternatives = pool.filter(item => item.word !== current?.word);
      const candidates = alternatives.length ? alternatives : pool;
      current = candidates[Math.floor(Math.random() * candidates.length)];
      session.seen += 1;
      session.recent.unshift(current);
      session.recent = dedupeByWord(session.recent).slice(0, 10);
      renderCard();
      updateStats();
      renderLists();
    }

    function reveal() {
      if (!current) return;
      answerVisible = true;
      renderCard();
    }

    function grade(isKnown) {
      if (!current) return;
      if (!answerVisible) reveal();
      const record = memory[current.word] || { score: 0, known: 0, missed: 0 };
      record.status = isKnown ? "known" : "missed";
      if (isKnown) {
        record.known += 1;
        record.score = Math.min(8, record.score + 1);
        session.known += 1;
      } else {
        record.missed += 1;
        record.score = Math.max(-8, record.score - 2);
        session.missed += 1;
        session.missedItems.unshift(current);
        session.missedItems = dedupeByWord(session.missedItems).slice(0, 20);
      }
      memory[current.word] = record;
      saveMemory();
      pickNext();
    }

    function renderCard() {
      if (!current) return;
      const prompt = mode === "word" ? current.word : current.definition;
      const answer = mode === "word" ? current.definition : current.word;
      els.currentGroup.textContent = current.group;
      els.promptText.textContent = prompt;
      els.promptText.classList.toggle("definition", mode === "definition");
      els.answerText.textContent = answerVisible ? answer : "Answer first, then reveal";
      els.answerText.classList.toggle("hidden", !answerVisible);
    }

    function updateStats() {
      els.seenCount.textContent = session.seen;
      els.knownCount.textContent = session.known;
      els.missedCount.textContent = WORDS.filter(item => memory[item.word]?.status === "missed").length;
      const attempts = session.known + session.missed;
      els.accuracy.textContent = attempts ? Math.round(session.known / attempts * 100) + "%" : "0%";
    }

    function renderLists() {
      els.missedList.innerHTML = renderItemList(WORDS.filter(item => memory[item.word]?.status === "missed"), "No missed words remaining");
      els.recentList.innerHTML = renderItemList(session.recent, "No review history yet");
    }

    function renderItemList(items, emptyText) {
      if (!items.length) return '<div class="empty">' + emptyText + '</div>';
      return items.map(item => '<div class="item"><b>' + escapeHtml(item.word) + '</b><span>' + escapeHtml(item.definition) + '</span></div>').join("");
    }

    function dedupeByWord(items) {
      const seen = new Set();
      return items.filter(item => {
        if (seen.has(item.word)) return false;
        seen.add(item.word);
        return true;
      });
    }

    function loadMemory() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
        if (!saved || typeof saved !== "object" || Array.isArray(saved)) return {};
        for (const [word, record] of Object.entries(saved)) {
          if (!record || typeof record !== "object") { delete saved[word]; continue; }
          // Older progress did not record the latest answer; recheck previously missed words.
          if (!record.status) record.status = record.missed > 0 ? "missed" : record.known > 0 ? "known" : "new";
        }
        return saved;
      }
      catch { return {}; }
    }

    function saveMemory() {
      localStorage.setItem(storageKey, JSON.stringify(memory));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }
  </script>
